name: Build SovereignCore Forge 1.20.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Compile, test task graph, and remap production JAR
        run: gradle clean build --no-daemon --stacktrace

      - name: List build outputs
        if: success()
        run: |
          echo "Build outputs:"
          find build/libs -maxdepth 1 -type f -name '*.jar' -printf '%f (%s bytes)\n'

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignCore-Forge-1.20.1-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
